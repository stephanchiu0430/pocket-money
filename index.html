<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的零用錢</title>
<meta name="theme-color" content="#1F6FB2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF2EE; --sheet:#F8FBF9; --ink:#1E2B3A; --muted:#62716B; --rule:#C7D5CC;
  --out:#A33A4C; --in:#1B7A5A; --pend:#8C9086; --accent:#1F6FB2; --on-accent:#FFFFFF;
  --body:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-child="Chantel"]{--accent:#6A4C9C}
:root[data-child="Luke"]{--accent:#1F6FB2}
:root[data-child="Ian"]{--accent:#2D7D4F}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111715; --sheet:#18201D; --ink:#E1EAE5; --muted:#93A39C; --rule:#2C3934;
    --out:#E4889A; --in:#62C99E; --pend:#8E948A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111715; --sheet:#18201D; --ink:#E1EAE5; --muted:#93A39C; --rule:#2C3934;
  --out:#E4889A; --in:#62C99E; --pend:#8E948A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-bottom:28px}

/* 封面 */
.cover{background:var(--accent);color:var(--on-accent);padding:18px 20px 24px;border-radius:0 0 22px 22px}
.who{display:flex;align-items:center;gap:.35em;font-size:1.1rem}
.who b{font-weight:700}
.gear{margin-left:auto;background:transparent;border:0;color:inherit;opacity:.8;min-width:44px;min-height:44px;font-size:1.25rem;border-radius:12px}
.bal-label{margin-top:10px;font-size:.92rem;opacity:.85}
.bal{font-family:var(--num);font-weight:600;font-size:clamp(2.6rem,13vw,3.7rem);line-height:1.08;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pend{font-size:.9rem;opacity:.9;min-height:1.3em}
.sync{margin-top:12px;font-size:.85rem;opacity:.88;display:flex;align-items:center;gap:.45em}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.sync.waiting::before{background:#FFD76A;opacity:1}

/* 按鈕 */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 14px 0}
.act{min-height:68px;border-radius:16px;border:2px solid;font-size:1.3rem;font-weight:700;letter-spacing:.05em}
.act.out{color:var(--out);border-color:var(--out);background:color-mix(in srgb,var(--out) 8%,var(--sheet))}
.act.in{color:var(--in);border-color:var(--in);background:color-mix(in srgb,var(--in) 8%,var(--sheet))}
.act:active{transform:translateY(1px)}
.count-link{display:block;margin:12px auto 0;background:transparent;border:0;color:var(--muted);font-size:.95rem;text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 12px}

/* 存摺 */
.book{margin:14px 12px 0;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.grid{display:grid;grid-template-columns:3.1em minmax(0,1fr) 4.5em 4.5em 4.9em;align-items:center}
.book-head{font-size:.78rem;color:var(--muted);padding:8px 8px 6px;border-bottom:3px double var(--rule)}
.book-head span:nth-child(n+3){text-align:right}
.month{padding:5px 10px;font-size:.8rem;color:var(--muted);background:var(--paper);border-bottom:1px solid var(--rule)}
.row{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:9px 8px;min-height:52px;font-size:.95rem}
.row:last-child{border-bottom:0}
.c-date{font-family:var(--num);font-size:.8rem;color:var(--muted)}
.c-desc{padding-right:6px;overflow-wrap:anywhere}
.c-desc small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
.c-out,.c-in,.c-bal{font-family:var(--num);font-size:.86rem;text-align:right;font-variant-numeric:tabular-nums;border-left:1px dotted var(--rule);align-self:stretch;display:flex;align-items:center;justify-content:flex-end;padding:0 5px 0 4px}
.c-out{color:var(--out)}
.c-in{color:var(--in)}
.row.pending .c-in,.row.rejected .c-in{color:var(--pend)}
.row.voided .c-desc,.row.voided .c-out,.row.voided .c-in,.row.rejected .c-in{text-decoration:line-through;opacity:.55}
.tag{display:inline-block;margin-left:.35em;padding:0 .45em;border:1px solid var(--rule);border-radius:999px;font-size:.72rem;color:var(--muted);vertical-align:1px;text-decoration:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#E0A800;margin-left:.4em;vertical-align:2px}
.empty{padding:28px 18px;color:var(--muted);text-align:center;margin:0}

/* 底部面板 */
dialog#sheet{border:0;padding:0;width:min(100%,520px);max-width:100%;margin:auto auto 0;border-radius:20px 20px 0 0;background:var(--sheet);color:var(--ink);max-height:92vh}
dialog#sheet::backdrop{background:rgba(15,25,22,.5)}
dialog#sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog#sheet[open]{animation:none}}
@media (min-width:600px){dialog#sheet{margin:auto;border-radius:20px}}
.sheet-in{padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-in h2{margin:0 0 6px;font-size:1.35rem}
.hint{margin:4px 0 10px;color:var(--muted);font-size:.92rem}
.amt{display:flex;align-items:baseline;gap:.2em;border-bottom:2px solid var(--ink);margin:10px 0 16px;font-family:var(--num);font-size:2.6rem;font-weight:600}
.amt span{color:var(--muted)}
.amt input{border:0;background:transparent;width:100%;font-family:var(--num);font-size:inherit;font-weight:inherit;outline:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;padding:8px 14px;min-height:44px;font-size:1rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.note,.field input,.pin{width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:11px 12px;font-size:1rem}
.field{display:block;margin:10px 0;font-size:.9rem;color:var(--muted)}
.field input{margin-top:4px;color:var(--ink)}
.pin{font-family:var(--num);font-size:1.6rem;letter-spacing:.3em;text-align:center}
.warn{color:var(--out);font-size:.92rem;margin:8px 0 0}
.ask{flex-basis:100%;margin:0 0 4px;font-size:1rem}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btns button{flex:1;min-height:52px;border-radius:14px;font-size:1.05rem;font-weight:700}
.primary{background:var(--accent);color:var(--on-accent);border:0}
.ghost{background:transparent;border:1.5px solid var(--rule)}
.danger{color:var(--out);border-color:var(--out)}
.detail dt{color:var(--muted);font-size:.85rem;margin-top:10px}
.detail dd{margin:0;font-size:1.05rem}
.result{font-family:var(--num);font-size:2rem;font-weight:600;margin:6px 0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.hbtn{background:rgba(255,255,255,.16);border:0;color:inherit;border-radius:999px;min-height:36px;min-width:44px;padding:0 12px;font-size:.85rem;font-weight:700;margin-left:auto}
.hbtn + .gear{margin-left:4px}
:root[lang="ja"]{--body:"LXGW WenKai TC","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
.langs{display:grid;gap:10px;margin-top:12px}
.langs button{min-height:52px;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);font-size:1.1rem;text-align:left;padding:0 16px}
.langs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
</style>
</head>
<body>
<main class="app">
  <header class="cover">
    <div class="who"><b id="who">　</b><button class="hbtn" id="langBtn"></button><button class="gear" id="gear">⚙︎</button></div>
    <div class="bal-label" data-i="canUse"></div>
    <div class="bal" id="bal">$0</div>
    <div class="pend" id="pend"></div>
    <div class="sync" id="sync"></div>
  </header>
  <section class="actions">
    <button class="act out" data-act="out" data-i="spend"></button>
    <button class="act in" data-act="in" data-i="receive"></button>
  </section>
  <button class="count-link" data-act="count" data-i="countLink"></button>
  <section class="book" id="book">
    <div class="book-head grid"><span data-i="cDate"></span><span data-i="cItem"></span><span data-i="cOut"></span><span data-i="cIn"></span><span data-i="cBal"></span></div>
    <div id="rows"></div>
  </section>
</main>
<dialog id="sheet"><div class="sheet-in" id="sheetIn"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function detectLang(){const n=(navigator.language||'').toLowerCase();return n.startsWith('ja')?'ja':n.startsWith('es')?'es':n.startsWith('en')?'en':'zh-Hant'}
let lang=ld('lang',null);if(!LANGS[lang])lang=detectLang();
const t=(k,v={})=>(S[lang][k]??S['zh-Hant'][k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');

async function sha(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
// 必須跟 Apps Script 的 hashOf_() 完全一樣
const canon=e=>[e.id,e.seq,e.ts,e.child,e.device,e.type,e.amount,e.cat,e.note,e.ref,e.expected,e.flags,e.prev].map(v=>v==null?'':String(v)).join('|');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);

/* ---------- 帳本計算 ---------- */
function allEntries(){
  const ids=new Set(server.entries.map(e=>e.id));
  const mine=pending.filter(p=>!ids.has(p.id)).map(p=>({...p,source:'kid',local:true}));
  return server.entries.concat(mine).map(e=>({...e,amount:Number(e.amount)||0}))
    .sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:(a.seq||0)-(b.seq||0));
}
function compute(){
  const es=allEntries();
  const voided=new Set(es.filter(e=>e.type==='void').map(e=>e.ref));
  let bal=0,pendIn=0;const rows=[];
  for(const e of es){
    if(e.type==='void')continue;
    let eff=0,state='';
    if(voided.has(e.id))state='voided';
    else if(e.type==='out')eff=-e.amount;
    else if(e.type==='adj')eff=e.amount;
    else if(e.type==='in'){
      if(e.source==='parent'||e.status==='ok')eff=e.amount;
      else if(e.status==='rejected')state='rejected';
      else{state='pending';pendIn+=e.amount}
    } else if(e.type==='count')state='count';
    bal+=eff;rows.push({e,eff,bal,state});
  }
  return {bal,pendIn,rows};
}

/* ---------- 畫面 ---------- */
function applyStatic(){
  document.documentElement.lang=lang;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('#book').setAttribute('aria-label',t('book'));
  const lb=$('#langBtn');lb.textContent=LANGS[lang].short;lb.setAttribute('aria-label',t('lang'));
  $('#gear').setAttribute('aria-label',t('parentT'));
}
function syncText(){
  if(!cfg.url)return[t('sNotSet'),true];
  if(syncing)return[t('sSyncing'),true];
  const n=pending.length;
  if(n)return[t('sWaiting',{n})+(navigator.onLine?'':t('sOffline')),true];
  if(server.at)return[t('sDone',{t:fmt(new Date(server.at),{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}),false];
  return[t('sNoConn'),true];
}
function rowHtml(r){
  const e=r.e,d=new Date(e.ts);
  let desc=e.source==='parent'?esc(t('fromDad',{c:catT(e.cat)})):esc(catT(e.cat));
  let outA='',inA='',tags='';
  if(e.type==='out')outA=money(e.amount);
  else if(e.type==='in')inA=money(e.amount);
  else if(e.type==='adj'){if(e.amount<0){outA=money(-e.amount);desc=esc(t('dadTook',{c:catT(e.cat)}))}else inA=money(e.amount)}
  if(e.type==='count'){
    const diff=e.amount-Number(e.expected);
    desc=`${esc(t('countRow',{m:money(e.amount)}))}<small>${esc(diff===0?t('same'):t(diff>0?'more':'less',{m:money(Math.abs(diff))}))}</small>`;
  } else if(e.note)desc+=`<small>${esc(e.note)}</small>`;
  if(r.state==='pending')tags+=`<span class="tag">${t('tPending')}</span>`;
  if(r.state==='rejected')tags+=`<span class="tag">${t('tRejected')}</span>`;
  if(r.state==='voided')tags+=`<span class="tag">${t('tVoided')}</span>`;
  if(e.local)tags+=`<span class="dot" title="${esc(t('tUnsynced'))}"></span>`;
  return `<button class="row grid ${r.state}" data-id="${esc(e.id)}"><span class="c-date">${fmt(d,{month:'numeric',day:'numeric'})}</span><span class="c-desc">${desc}${tags}</span><span class="c-out">${outA}</span><span class="c-in">${inA}</span><span class="c-bal">${r.eff?money(r.bal):''}</span></button>`;
}
function render(){
  applyStatic();
  if(!cfg)return;
  document.documentElement.dataset.child=cfg.child;
  document.querySelector('meta[name=theme-color]').content=COLORS[cfg.child];
  $('#who').textContent=t('whose',{n:cfg.child});
  const {bal,pendIn,rows}=compute();
  $('#bal').textContent=money(bal);
  $('#pend').textContent=pendIn?t('pendNote',{m:money(pendIn)}):'';
  const [txt,w]=syncText();const s=$('#sync');s.textContent=txt;s.classList.toggle('waiting',w);
  let html='',cur='';
  for(const r of rows.slice().reverse()){
    const m=fmt(new Date(r.e.ts),{year:'numeric',month:'long'});
    if(m!==cur){html+=`<div class="month">${esc(m)}</div>`;cur=m}
    html+=rowHtml(r);
  }
  $('#rows').innerHTML=html||`<p class="empty">${esc(t('empty'))}</p>`;
}

/* ---------- 新增紀錄（只能新增，不能改） ---------- */
async function addEntry(f){
  const seq=chain.seq+1;
  const e={id:'K-'+cfg.device.slice(0,8)+'-'+seq,seq,ts:new Date().toISOString(),child:cfg.child,device:cfg.device,
    type:f.type,amount:f.amount,cat:f.cat||'',note:f.note||'',ref:f.ref||'',
    expected:f.expected===undefined?'':f.expected,flags:f.flags||'',prev:chain.lastHash};
  e.hash=await sha(canon(e));
  chain={seq,lastHash:e.hash};pending.push(e);
  st('chain',chain);st('pending',pending);
  render();sync();
  return e;
}

function openEntry(type){
  const isCount=type==='count';
  const title={out:t('qOut'),in:t('qIn'),count:t('qCount')}[type];
  let h=`<h2>${esc(title)}</h2>`;
  if(isCount)h+=`<p class="hint">${esc(t('countHint'))}</p>`;
  h+=`<label class="amt"><span>$</span><input id="f-amt" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="${esc(t('amount'))}"></label>`;
  if(!isCount){
    h+=`<div class="chips" role="group" aria-label="${esc(t('category'))}">${CATS[type].map(c=>`<button type="button" class="chip" aria-pressed="false" data-cat="${c}">${esc(catT(c))}</button>`).join('')}</div>`;
    h+=`<input id="f-note" class="note" maxlength="40" placeholder="${esc(t(type==='out'?'phOut':'phIn'))}" aria-label="${esc(t('note'))}">`;
  }
  if(type==='in')h+=`<p class="hint">${esc(t('inHint'))}</p>`;
  h+=`<p id="f-warn" class="warn" hidden></p><div class="btns" id="f-btns"><button class="ghost" data-close>${esc(t('cancel'))}</button><button class="primary" id="f-save">${esc(t('save'))}</button></div>`;
  showSheet(h);
  let cat='';
  sheetIn.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;sheetIn.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const amtEl=$('#f-amt');
  amtEl.oninput=()=>{
    amtEl.value=amtEl.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,6);
    if(type==='out'){const a=+amtEl.value,b=compute().bal,w=$('#f-warn');
      if(a>b){w.hidden=false;w.textContent=t('overWarn',{m:money(a-b)})}else w.hidden=true}
  };
  setTimeout(()=>amtEl.focus(),60);
  $('#f-save').onclick=async()=>{
    if(amtEl.value===''||(!isCount&&+amtEl.value===0)){toast(t('needAmt'));amtEl.focus();return}
    const a=parseInt(amtEl.value,10);
    if(isCount){const exp=compute().bal;await addEntry({type,amount:a,cat:'盤點',expected:exp});showCountResult(a,exp);return}
    if(!cat){toast(t('needCat'));return}
    const note=$('#f-note').value.trim();
    const flags=[];if(type==='out'&&a>compute().bal)flags.push('over');
    const save=async()=>{await addEntry({type,amount:a,cat,note,flags:flags.join(',')});closeSheet();toast(t('saved'))};
    if(type==='out'&&cfg.bigLimit&&a>=cfg.bigLimit){
      $('#f-btns').innerHTML=`<p class="ask">${esc(t('bigAsk',{m:money(a)}))}</p><button class="ghost" id="f-no">${esc(t('notYet'))}</button><button class="primary" id="f-yes">${esc(t('yesAsked'))}</button>`;
      $('#f-yes').onclick=()=>{flags.push('big:asked');save()};
      $('#f-no').onclick=()=>{flags.push('big:notasked');save()};
    } else save();
  };
}

function showCountResult(a,exp){
  const diff=a-exp;
  const msg=diff===0?t('countSame'):t(diff>0?'countMore':'countLess',{m:money(Math.abs(diff))})+' '+t('countTail');
  showSheet(`<h2>${esc(t('countDone'))}</h2><p class="hint">${esc(t('countSum',{a:money(exp),b:money(a)}))}</p><p class="result">${diff===0?'$0':(diff>0?'+':'-')+money(Math.abs(diff))}</p><p>${esc(msg)}</p><div class="btns"><button class="primary" data-close>${esc(t('ok'))}</button></div>`);
}

function openDetail(id){
  const r=compute().rows.find(x=>x.e.id===id);if(!r)return;
  const e=r.e,d=new Date(e.ts);
  const typeZh=t('ty'+e.type);
  const status=e.local?t('stLocal'):r.state==='pending'?t('stPending'):r.state==='rejected'?t('stRejected'):r.state==='voided'?t('stVoided'):t('stOk');
  let h=`<h2>${esc(typeZh)} ${e.type==='count'?money(e.amount):money(Math.abs(e.amount))}</h2><dl class="detail">
    <dt>${esc(t('time'))}</dt><dd>${esc(fmt(d,{dateStyle:'medium',timeStyle:'short'}))}</dd>
    <dt>${esc(t('category'))}</dt><dd>${esc(e.source==='parent'?t('fromDad',{c:catT(e.cat)}):catT(e.cat))}</dd>
    ${e.note?`<dt>${esc(t('note'))}</dt><dd>${esc(e.note)}</dd>`:''}
    <dt>${esc(t('status'))}</dt><dd>${esc(status)}</dd></dl>`;
  const canVoid=e.source==='kid'&&(e.type==='out'||e.type==='in')&&r.state!=='voided'&&r.state!=='rejected';
  h+=`<div class="btns">${canVoid?`<button class="ghost danger" id="d-void">${esc(t('void'))}</button>`:''}<button class="primary" data-close>${esc(t('close'))}</button></div>`;
  if(canVoid)h+=`<p class="hint">${esc(t('voidHint'))}</p>`;
  showSheet(h);
  if(canVoid){const b=$('#d-void');b.onclick=async()=>{
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent=t('voidSure');return}
    await addEntry({type:'void',amount:0,cat:'撤銷',ref:e.id,note:'撤銷 '+e.cat+' '+money(e.amount)});closeSheet();toast(t('voidDone'));
  }}
}

    <label class="field">${esc(t('pinNew'))}<input id="u-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
    <label class="field">${esc(t('pinAgain'))}<input id="u-pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
    <label class="field">${esc(t('urlLater'))}<input id="u-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label class="field">${esc(t('big'))}<input id="u-big" inputmode="numeric" value="500"></label>
    <p id="u-err" class="warn" hidden></p>
    <div class="btns"><button class="ghost" id="u-lang">${esc(t('lang'))}：${LANGS[lang].label}</button><button class="primary" id="u-ok">${esc(t('start'))}</button></div>`,true);
  sheetIn.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{kid=b.dataset.kid;document.documentElement.dataset.child=kid;sheetIn.querySelectorAll('[data-kid]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#u-lang').onclick=openLang;
  $('#u-ok').onclick=async()=>{
    const err=m=>{const e=$('#u-err');e.hidden=false;e.textContent=m};
    const p=$('#u-pin').value;
    if(!kid)return err(t('pickKid'));
    if(!/^\d{4,8}$/.test(p))return err(t('pinRule'));
    if(p!==$('#u-pin2').value)return err(t('pinMismatch'));
    cfg={child:kid,device:uid(),url:$('#u-url').value.trim(),bigLimit:parseInt($('#u-big').value,10)||0,pinHash:await sha('pin:'+p)};
    chain={seq:0,lastHash:'GENESIS'};pending=[];server={entries:[],at:0};
    st('cfg',cfg);st('chain',chain);st('pending',pending);st('server',server);
    closeSheet();render();sync();
  };
}

/* ---------- 同步：試算表是正本 ---------- */
async function sync(){
  if(!cfg||!cfg.url||syncing)return;
  syncing=true;render();
  try{
    const body=JSON.stringify(pending.length?{action:'push',child:cfg.child,device:cfg.device,entries:pending}:{action:'pull',child:cfg.child,device:cfg.device});
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const data=await r.json();
    if(!data.ok)throw new Error(data.error||'error');
    server={entries:data.entries||[],at:Date.now()};
    const ids=new Set(server.entries.map(e=>e.id));
    pending=pending.filter(p=>!ids.has(p.id));
    st('server',server);st('pending',pending);lastErr='';
  }catch(e){lastErr=e.message||String(e)}
  finally{syncing=false;render()}
}

/* ---------- 啟動 ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a&&cfg){openEntry(a.dataset.act);return}
  const row=e.target.closest('.row');if(row)openDetail(row.dataset.id);
});
$('#gear').onclick=()=>{if(cfg)askPin(openSettings)};
$('#langBtn').onclick=openLang;
window.addEventListener('online',sync);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
setInterval(()=>{if(document.visibilityState==='visible')sync()},60000);

applyStatic();
if(!window.crypto||!crypto.subtle){
  document.body.innerHTML=`<p style="padding:24px">${esc(t('https'))}</p>`;
} else if(!cfg){openSetup()} else {render();sync()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
